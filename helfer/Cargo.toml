[package]
name = "funkel-helfer"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Funkels Helfer: Text umformen mit einem lokalen Sprachmodell (llama.cpp)"

# Eigener Prozess: llama.cpp und whisper.cpp bringen je eine eigene ggml-Bibliothek mit,
# in einem Programm kollidieren die Symbole.
[dependencies]
llama-cpp-2 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sprechertrennung (sherpa-onnx), Rohschnittstelle statt sherpa-rs: dort sind beide Modelle
# fest auf einen Rechenkern gesetzt. Nicht auf Windows: die statischen sherpa-Bibliotheken
# (/MT) und llama.cpp (/MD) lassen sich dort nicht zusammen linken (LNK2038), offen.
[target.'cfg(not(windows))'.dependencies]
sherpa-rs-sys = { version = "=0.6.8", default-features = false, features = ["download-binaries", "static"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1", features = ["metal"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
