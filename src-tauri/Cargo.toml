[package]
name = "funkel"
version = "0.1.0"
description = "Diktieren mit zwei Tipps, offline, auf Mac und Windows"
authors = ["Theo Studio"]
license = "MIT"
edition = "2021"

[lib]
name = "funkel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
whisper-rs = "0.14"
arboard = "3"
ureq = "2"
dirs = "5"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal: Erkennung auf der Grafik des Apple-Chips
whisper-rs = { version = "0.14", features = ["metal"] }
core-foundation = "0.10"
objc2 = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
